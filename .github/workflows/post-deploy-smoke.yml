name: Production smoke after main

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: production-smoke-main
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECT_RATE_LIMIT_BACKEND: shared
      EXPECT_DEPLOYMENT_REVISION: ${{ github.event.workflow_run.head_sha }}
      CHECK_NPM_RELEASE: 1
    steps:
      - name: Check out the validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for native WebMCP verification
        run: npx playwright install --with-deps chromium

      - name: Wait for the validated Hostinger revision
        shell: bash
        run: |
          mkdir -p test-results/agent-readiness
          node scripts/wait-for-deployment.mjs 2>&1 | tee test-results/agent-readiness/deployment-wait.log

      - name: Verify production pages, APIs, caching, and all 13 agent-readiness checks
        shell: bash
        run: npm run smoke:production 2>&1 | tee test-results/agent-readiness/production-smoke.log

      - name: Upload production agent-readiness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-readiness-production
          path: test-results/agent-readiness/
          if-no-files-found: warn
          retention-days: 14
