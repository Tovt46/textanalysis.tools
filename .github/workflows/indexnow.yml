name: Notify IndexNow after deployment

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      EXPECT_DEPLOYMENT_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out the validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Wait for the validated Hostinger revision
        shell: bash
        run: |
          mkdir -p test-results/indexnow
          node scripts/wait-for-deployment.mjs 2>&1 | tee test-results/indexnow/deployment-wait.log

      - name: Submit only new and updated public pages
        env:
          INDEXNOW_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: npm run indexnow:notify 2>&1 | tee test-results/indexnow/notification.log

      - name: Upload IndexNow receipts and change list
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: indexnow-production
          path: test-results/indexnow/
          if-no-files-found: warn
          retention-days: 14
