name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test production build, pages, APIs, CLI, and MCP
        run: npm test

      - name: Install Chromium for browser interaction tests
        run: npx playwright install --with-deps chromium

      - name: Test all tool examples at desktop and mobile sizes
        run: npm run test:browser

      - name: Audit all dependencies
        run: npm audit

      - name: Install and verify the packed CLI runtime tree
        run: npm run test:package
